name: Fork sync from upstream

# Merge NousResearch/hermes-agent main into this fork, run fork tests, push
# to main when green. Unique fork commits are kept (merge, not rebase).
# Conflicts fail the job; nothing is pushed.

on:
  schedule:
    - cron: "0 20 * * *" # 06:00 AEST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and test
    if: github.repository == 'Babbletrax/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch NousResearch main
        run: |
          git remote add nous https://github.com/NousResearch/hermes-agent.git
          git fetch nous main --quiet

      - name: Merge nous/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "hermes-fork-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor nous/main HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork already contains nous/main"
            exit 0
          fi
          echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
          git merge --no-edit nous/main

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        if: steps.merge.outputs.already_up_to_date != 'true'
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Python 3.11 + deps
        if: steps.merge.outputs.already_up_to_date != 'true'
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install -e ".[dev,acp]"

      - name: Fork tests (on + off + survival)
        if: steps.merge.outputs.already_up_to_date != 'true'
        run: |
          .venv/bin/python -m pytest \
            tests/fork/test_patch_survival.py \
            tests/tools/test_hardline_disk_review.py \
            tests/tools/test_hardline_blocklist.py \
            tests/hermes_cli/test_approvals_test.py \
            tests/acp_adapter/test_entry.py \
            tests/acp_adapter/test_extra_toolsets.py \
            -q --tb=short
          HERMES_DISK_OWNER_REVIEW=0 .venv/bin/python -m pytest \
            tests/tools/test_hardline_disk_review.py::test_disk_owner_review_off_restores_hardline \
            tests/tools/test_hardline_disk_review.py::test_disk_owner_review_off_blocks_under_yolo \
            tests/hermes_cli/test_approvals_test.py::TestVerdicts::test_disk_command_hardline_when_owner_review_off \
            -q --tb=short

      - name: Push main
        if: steps.merge.outputs.already_up_to_date != 'true'
        run: git push origin HEAD:main
